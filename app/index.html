<!DOCTYPE html>
<html lang="en" data-accent="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alexander Bots</title>
<meta name="description" content="Alexander Bots — your AI companion. Chat, notes vault, knowledge graph, and help, in one beautiful app.">
<meta name="theme-color" content="#041027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=13">
</head>
<body>

<header class="app-header">
  <a class="brand" href="#/chat" aria-label="Alexander Bots home">
    <img class="brand-logo brand-lockup" src="assets/logo-lockup.png?v=13" srcset="assets/logo-lockup@2x.png?v=13 2x" alt="Alexander AI Solutions" height="38">
    <span class="brand-text">
      <span class="brand-name fire" id="brand-name">Alexander Bots</span>
      <span class="brand-tag" id="brand-tag"></span>
    </span>
  </a>

  <div class="pet" id="pet" data-state="waiting" role="img" aria-label="Bot status: waiting">
    <span class="pet-face" id="pet-face" aria-hidden="true">😊</span>
    <span class="pet-label" id="pet-label">waiting</span>
  </div>
</header>

<main class="app-main">
  <section id="view" class="view" aria-live="polite" aria-label="App content"></section>
</main>

<nav class="tabbar" aria-label="Primary">
  <a class="tab" href="#/chat" data-route="chat">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>Chat</span>
  </a>
  <a class="tab" href="#/bots" data-route="bots">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v4M9 13h.01M15 13h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Bots</span>
  </a>
  <a class="tab" href="#/vault" data-route="vault">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v12a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 16.5A2.5 2.5 0 0 1 7.5 14H19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Vault</span>
  </a>
  <a class="tab" href="#/activity" data-route="activity">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Activity</span>
  </a>
  <a class="tab" href="#/graph" data-route="graph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 6.7l7 .9M6.8 8.4l2.4 7M16 10l-4.6 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>Graph</span>
  </a>
  <a class="tab" href="#/help" data-route="help">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 9.4a2.6 2.6 0 1 1 3.7 2.4c-.9.4-1.3.9-1.3 1.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></svg>
    <span>Help</span>
  </a>
  <a class="tab" href="#/settings" data-route="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Settings</span>
  </a>
</nav>

<dialog class="qr-dialog" id="qr-modal" aria-labelledby="qr-title">
  <div class="qr-card">
    <button class="icon-btn qr-close" id="qr-close" type="button" aria-label="Close">&#x2715;</button>
    <h2 class="fire" id="qr-title">Get the mobile app</h2>
    <p class="muted">Scan the QR code with your phone camera, or copy the link to open the download page.</p>
    <div class="qr-box" id="qr-box" role="img" aria-label="QR code for the download page"></div>
    <p class="qr-url" id="qr-url"></p>
    <div class="qr-actions">
      <button class="btn btn-accent" id="qr-copy" type="button">Copy link</button>
      <a class="btn btn-ghost" id="qr-open" href="#" target="_blank" rel="noopener">Open download page</a>
    </div>
  </div>
</dialog>

<div class="toast-root" id="toast-root" aria-live="polite"></div>

<noscript><p class="noscript-note">Alexander Bots needs JavaScript to run.</p></noscript>

<script src="config.js?v=13"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="markdown.js?v=13"></script>
<script src="vault-data.js?v=13"></script>
<script src="help-data.js?v=13"></script>
<script src="graph.js?v=14"></script>
<script src="computer-tools.js?v=14"></script>
<script src="app.js?v=14"></script>
<script>
try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline/static hosts: fine without */ });
    });
  }
} catch (e) { /* service workers unavailable: app still works */ }
</script>
</body>
</html>
