      /* Davis Carpet. Hero artwork full width behind everything, with dark
         translucent surfaces so the words can be white and easy to read.
         Sized generously for comfortable reading. Nothing here blocks input. */
      html { background: rgb(2, 13, 38); font-size: 22px; }
      body {
        background-color: rgb(2, 13, 38);
        background-image: linear-gradient(rgba(2, 10, 30, 0.45), rgba(2, 10, 30, 0.45)),
                          url("/alexander-hero-2.png?v=2");
        background-size: cover, cover;
        background-position: center, center;
        background-repeat: no-repeat, no-repeat;
        background-attachment: fixed, fixed;
      }
      #root main { background: none; }

      /* Dark translucent surfaces, so white words read everywhere. */
      #root .bg-background {
        background-color: rgba(6, 18, 43, 0.74) !important;
      }
      #root .bg-card {
        background-color: rgba(8, 22, 50, 0.80) !important;
      }
      #root .bg-muted {
        background-color: rgba(10, 26, 56, 0.70) !important;
      }
      #root .bg-secondary,
      #root .bg-accent {
        background-color: rgba(12, 28, 60, 0.75) !important;
      }
      #root .bg-popover {
        background-color: rgba(6, 16, 40, 0.96) !important;
      }
      #root .bg-primary {
        background-color: rgb(40, 150, 255) !important;
      }
      #root .bg-white {
        background-color: rgba(8, 22, 50, 0.80) !important;
      }

      /* White centers on the words (not black). */
      #root, #root * { color: #ffffff !important; }

      /* Side panels stay transparent so the artwork shows through. */
      #root .bg-sidebar {
        background-color: transparent !important;
        --sidebar-foreground: rgb(255, 255, 255);
        --sidebar-accent-foreground: rgb(255, 255, 255);
        --sidebar-ring: rgb(90, 160, 255);
      }

      /* Wider bot side panel, and larger type throughout. */
      [style*="--sidebar-width"] {
        --sidebar-width: 430px !important;
      }
      #root .text-\[14px\] { font-size: 21px !important; }
      #root .text-\[13px\] { font-size: 20px !important; }
      #root .text-\[12px\] { font-size: 18px !important; }
      #root .text-\[11px\] { font-size: 17px !important; }
      #root .text-\[10px\] { font-size: 16px !important; }
      #root .text-xs { font-size: 18px !important; }

      /* Light fire glow, tight so the letters stay crisp. */
      #root main, #root main *,
      #root .bg-sidebar, #root .bg-sidebar * {
        text-shadow: 0 0 7px rgba(255, 218, 120, 1),
                     0 0 18px rgba(255, 145, 0, 0.9),
                     0 0 36px rgba(255, 75, 0, 0.65),
                     0 0 60px rgba(255, 40, 0, 0.4) !important;
      }

      /* No box behind the words the user sends. */
      #root [data-align="end"] [data-slot="bubble"],
      #root [data-align="end"] [data-slot="bubble-content"] {
        background-color: transparent !important;
      }

      /* Explore-agent cards: no box at all - the words and the avatar sit
         straight on the artwork, with the avatar cooled to the site's blue. */
      #root .bg-foreground\/10 {
        background-color: transparent !important;
        border: none !important;
      }
      #root .bg-background\/40,
      #root .bg-background\/50 {
        background-color: transparent !important;
      }
      /* Explore-agent cards carry no art of their own: the words sit straight
         on the background. */
      #root .bg-foreground\/10 > div:first-child { display: none !important; }
      /* Every other bot avatar in the app, cooled to the site's blue. */
      #root svg[viewBox="0 0 80 80"] {
        filter: saturate(0.55) brightness(0.75) hue-rotate(190deg);
      }

      /* Explore-agent cards use the supplied card images. */
      #root .basis-auto .bg-foreground\/10 {
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
      }
      #root .basis-auto:nth-child(1) .bg-foreground\/10 { background-image: url("/card-1.png") !important; }
      #root .basis-auto:nth-child(2) .bg-foreground\/10 { background-image: url("/card-2.png") !important; }
      #root .basis-auto:nth-child(3) .bg-foreground\/10 { background-image: url("/card-3.png") !important; }
      #root .basis-auto:nth-child(4) .bg-foreground\/10 { background-image: url("/card-4.png") !important; }
      #root .basis-auto:nth-child(5) .bg-foreground\/10 { background-image: url("/card-1.png") !important; }

      /* Words you type stay crisp: no glow inside inputs, textareas,
         selects, the composer, or anything editable - in the main panel
         and in the side panel alike. */
      #root input, #root textarea, #root select, #root [contenteditable],
      #root main input, #root main textarea, #root main select,
      #root main [contenteditable],
      #root .bg-sidebar input, #root .bg-sidebar textarea,
      #root .bg-sidebar select, #root .bg-sidebar [contenteditable] {
        text-shadow: none !important;
      }
      #root input::placeholder, #root textarea::placeholder,
      #root .bg-sidebar input::placeholder, #root main input::placeholder {
        text-shadow: none !important;
      }

      /* ------------------------------------------------------------------
         Phones: smaller type, lighter glow, comfortable controls.
         The app collapses its own sidebar on small screens; these rules
         just size everything for a hand-held screen.
         ------------------------------------------------------------------ */
      @media (max-width: 760px) {
        html { font-size: 17px; }
        #root .text-\[14px\] { font-size: 16px !important; }
        #root .text-\[13px\] { font-size: 15px !important; }
        #root .text-\[12px\] { font-size: 14px !important; }
        #root .text-\[11px\] { font-size: 13px !important; }
        #root .text-\[10px\] { font-size: 12px !important; }
        #root .text-xs { font-size: 14px !important; }
        [style*="--sidebar-width"] { --sidebar-width: 88vw !important; }
        #root main, #root main *,
        #root .bg-sidebar, #root .bg-sidebar * {
          text-shadow: 0 0 4px rgba(255, 218, 120, 0.9),
                       0 0 12px rgba(255, 145, 0, 0.65) !important;
        }
        body { background-attachment: scroll, scroll; }
        #root input, #root textarea { font-size: 17px !important; }
      }
      @media (max-width: 420px) {
        html { font-size: 16px; }
      }

      /* ------------------------------------------------------------------
         Phones: the nav toggle moves to the bottom of the page, under the
         composer, so the side panel is easy to open with a thumb.
         ------------------------------------------------------------------ */
      @media (max-width: 760px) {
        #root button[aria-label="Show sidebar"] {
          position: fixed !important;
          left: 50% !important;
          top: auto !important;
          transform: translateX(-50%) !important;
          bottom: 4px !important;
          z-index: 70 !important;
          width: 40px; height: 40px;
          border-radius: 999px;
          background: rgba(9, 24, 52, 0.9) !important;
          border: 1px solid rgba(90, 160, 255, 0.55) !important;
          box-shadow: 0 0 14px rgba(60, 130, 255, 0.35);
          color: #ffffff !important;
        }
        #root button[aria-label="Show sidebar"] svg { color: #ffffff !important; }
      }

      /* ------------------------------------------------------------------
         The signed-in user's menu: the QR card it opens, and the links that
         used to sit in the sidebar. The card lives outside #root, so it
         carries its own colours instead of inheriting the app theme.
         ------------------------------------------------------------------ */
      dialog.ob-qr {
        position: fixed; inset: 0; margin: auto;
        width: min(430px, 92vw); max-height: 92vh; overflow: auto;
        border: 1px solid rgba(90, 160, 255, 0.55);
        border-radius: 18px;
        background: rgba(6, 16, 40, 0.97);
        color: #ffffff;
        padding: 26px 24px 22px;
        font-size: 17px;
        box-shadow: 0 0 44px rgba(60, 130, 255, 0.4);
      }
      dialog.ob-qr::backdrop { background: rgba(2, 8, 22, 0.72); }
      dialog.ob-qr h2 {
        margin: 0 0 8px; font-size: 23px; color: #ffffff;
        text-shadow: 0 0 7px rgba(255, 218, 120, 1), 0 0 18px rgba(255, 145, 0, 0.9),
                     0 0 36px rgba(255, 75, 0, 0.65);
      }
      dialog.ob-qr p { font-size: 15px; line-height: 1.5; color: rgba(255, 255, 255, 0.88); margin: 0 0 18px; }
      .ob-qr-box {
        width: 224px; height: 224px; margin: 0 auto 14px;
        background: #ffffff; border-radius: 12px; padding: 10px; box-sizing: border-box;
      }
      .ob-qr-box svg { width: 100%; height: 100%; display: block; }
      .ob-qr-url { font-size: 13px; word-break: break-all; text-align: center; color: rgba(255, 255, 255, 0.72); margin: 0 0 18px; }
      .ob-qr-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .ob-qr-btn {
        border: 0; border-radius: 10px; padding: 10px 16px;
        font: inherit; font-size: 16px; cursor: pointer; text-decoration: none;
      }
      .ob-qr-btn.primary { background: rgb(40, 150, 255); color: #ffffff; }
      .ob-qr-btn.ghost { background: transparent; border: 1px solid rgba(90, 160, 255, 0.55); color: #ffffff; }
      .ob-qr-close {
        position: absolute; top: 10px; right: 12px; background: transparent;
        border: 0; color: #ffffff; font-size: 19px; line-height: 1; cursor: pointer; padding: 6px;
      }

        function buildModal() {
          if (document.getElementById("ob-qr")) return;
          var dlg = document.createElement("dialog");
          dlg.id = "ob-qr";
          dlg.className = "ob-qr";
          dlg.setAttribute("aria-labelledby", "ob-qr-title");
          dlg.innerHTML =
            '<button class="ob-qr-close" type="button" aria-label="Close">&#x2715;</button>' +
            '<h2 id="ob-qr-title">Get the mobile app</h2>' +
            '<p>Scan the QR code with your phone camera, or copy the link to open the download page.</p>' +
            '<div class="ob-qr-box" role="img" aria-label="QR code for the download page">' + QR_SVG + '</div>' +
            '<p class="ob-qr-url">' + QR_URL + '</p>' +
            '<div class="ob-qr-actions">' +
              '<button class="ob-qr-btn primary" type="button" id="ob-qr-copy">Copy link</button>' +
              '<a class="ob-qr-btn ghost" href="' + QR_URL + '" target="_blank" rel="noopener">Open download page</a>' +
            '</div>';
          document.body.appendChild(dlg);
          dlg.querySelector(".ob-qr-close").addEventListener("click", function () { dlg.close(); });
          dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
          var copy = dlg.querySelector("#ob-qr-copy");
          copy.addEventListener("click", function () {
            var done = function () {
              copy.textContent = "Copied";
              setTimeout(function () { copy.textContent = "Copy link"; }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(QR_URL).then(done, done);
            } else {
              var t = document.createElement("textarea");
              t.value = QR_URL; t.style.position = "fixed"; t.style.opacity = "0";
              document.body.appendChild(t); t.select();
              try { document.execCommand("copy"); } catch (e) {}
              document.body.removeChild(t); done();
            }
          });
        }

        function openQR() {
          buildModal();
          var dlg = document.getElementById("ob-qr");
          if (!dlg) return;
          try {
            if (typeof dlg.showModal === "function") { if (!dlg.open) dlg.showModal(); }
            else dlg.setAttribute("open", "");
          } catch (e) { dlg.setAttribute("open", ""); }
        }

        function closeUserMenu() {
          var trigger = document.querySelector('#root .bg-sidebar [data-slot="dropdown-menu-trigger"]');
          if (trigger) trigger.click();
        }

        /* Drop the cached copy of this page and reload the newest build. */
        function updateApp() {
          var go = function () {
            location.replace(location.pathname + "?fresh=" + Date.now() + location.hash);
          };
          var jobs = [];
          try {
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) { /* no CacheStorage */ }
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
          } catch (e) { /* no service worker */ }
          Promise.all(jobs).then(go, go);
        }

        var USER_LINKS = [
          { label: "Obsidian Vault", href: "https://vault.jays-web.org/davis/" },
          { label: "Obsidian Graph", href: "https://vault.jays-web.org/davis/graph.html" },
          { label: "Skills", href: "/skills" },
          { label: "Agents", href: "/agents" },
          { label: "OpenRouter", href: "https://openrouter.ai/", blank: true },
          { label: "Help", href: "/help/" },
          { label: "Get the app", qr: true },
          { label: "Update the app", update: true }
        ];

        function extendUserMenu() {
          var content = document.querySelector('[data-slot="dropdown-menu-content"]');
          if (!content || content.getAttribute("data-ob-links")) return;
          var model = content.querySelector('a[data-slot="dropdown-menu-item"]');
          if (!model) return;
          content.setAttribute("data-ob-links", "1");
          var added = [];
          USER_LINKS.forEach(function (link) {
            var a = model.cloneNode(true);
            a.removeAttribute("id");
            a.textContent = "";
            var span = document.createElement("span");
            span.textContent = link.label;
            a.appendChild(span);
            if (link.qr) {
              a.setAttribute("href", "#");
              a.addEventListener("click", function (e) {
                e.preventDefault();
                openQR();
                closeUserMenu();
              });
            } else if (link.update) {
              a.setAttribute("href", "#");
              a.addEventListener("click", function (e) {
                e.preventDefault();
                updateApp();
              });
            } else {
              a.setAttribute("href", link.href);
              if (link.blank) {
                a.setAttribute("target", "_blank");
                a.setAttribute("rel", "noopener");
              }
            }
            added.push(a);
          });
          var sep = content.querySelector('[data-slot="dropdown-menu-separator"]');
          if (sep) {
            added.push(sep.cloneNode(true));
          } else {
            var divider = document.createElement("div");
            divider.setAttribute("data-slot", "dropdown-menu-separator");
            divider.style.cssText = "height:1px;margin:6px 4px;background:rgba(255,255,255,0.14);";
            added.push(divider);
          }
          var first = content.firstElementChild;
          added.forEach(function (el) { content.insertBefore(el, first); });
        }

        var mo = new MutationObserver(function () { extendUserMenu(); });
        mo.observe(document.documentElement, { childList: true, subtree: true });
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () { extendUserMenu(); });
        } else { extendUserMenu(); }
      })();
